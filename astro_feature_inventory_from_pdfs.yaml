doctrine_locks:
  - id: LOCK_TIME_UTC
    requirement: "Use UTC internally and preserve display timezone separately."
    sources: ["STRICT_JYOTISH_ML:p1-p2", "STRICT_VEDIC_LLM:p3"]
  - id: LOCK_DOCTRINE_CONFIG
    requirement: "Version ayanamsa, zodiac, graha set, node type, aspect/drishti method, and ephemeris path."
    sources: ["STRICT_JYOTISH_ML:p1-p4", "STRICT_VEDIC_LLM:p3-p4"]
  - id: NO_LLM_IN_LOGIC
    requirement: "LLM may explain only; it must not compute events, labels, or trades."
    sources: ["STRICT_JYOTISH_ML:p1,p5-p7", "STRICT_VEDIC_LLM:p1-p3"]
  - id: ML_CALIBRATION_SCOPE
    requirement: "ML may tune weights, thresholds, windows, and interactions, not invent astrology."
    sources: ["STRICT_JYOTISH_ML:p6-p8", "STRICT_VEDIC_LLM:p6-p8"]

