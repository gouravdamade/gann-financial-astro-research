  - evidencePacketId: TD1972_VEDHA_VARIABLE_DIRECTION_V14
    category: planet_specific_direction_rule
    sourceCitation:
      printedPage: '4'
      pdfImageIndex: 20
      locator: verses 12-14 and Hindi commentary
    originalSanskritHindiText:
      - 'वक्रगे दक्षिणा दृष्टिर्वामा दष्टिइच शी घ्रगे । मध्यचारे तथा मध्या ज्ञेया भौमादिपञ्चके ॥ १४ ॥'
      - 'भौमादि पांचों (मंगल, बुध, बृहस्पति, शुक्र और शनि) ग्रहों में से जो ग्रह वक्री हो उसकी दृष्टि दाहिनी ओर को, जो ग्रह शीघ्रगामी (अतिचारी) हो उसकी दृष्टि बाई ओर को, और जो ग्रह मध्यचारी हो उसकी दृष्टि सामने को होती है।'
    literalTranscription:
      text: 'vakrage dakshina drstir vama drsti ca sighrage; madhyacare tatha madhya jneya bhaumadipancake'
      status: OCR_ASSISTED_SOURCE_IMAGE_CITATION_CONTROLS_DISPUTED_READING
    literalTranslation: 'For the five planets beginning with Mars: a retrograde planet has the right-side look, a swift planet the left-side look, and a mean-moving planet the front look.'
    implementationInterpretation: Figure-relative ray selection for Mars, Mercury, Jupiter, Venus, and Saturn only.
    exactCategoricalRule:
      bodies: [MARS, MERCURY, JUPITER, VENUS, SATURN]
      RETROGRADE: RIGHT
      SWIFT: LEFT
      MEAN: FRONT
    numericalValue: null
    dependencies: [SBC_GRID_FIGURE_RELATIVE_ORIENTATION, EXPLICIT_MOTION_STATE_INPUT]
    ambiguityNotes:
      - The text supplies qualitative swift and mean labels but no numeric speed threshold.
      - LEFT, FRONT, and RIGHT are figure-relative; no geographic cardinal direction is admitted.
    conflictingWitnessNotes: Other workspace profiles use different fixed-direction conventions; profiles must remain named and separate.
    proposedVariableId: SBC_TD1972_VARIABLE_PLANET_DIRECTION
    permittedOscillatorRole: ACTIVATION
    proposedMode1Limitations:
      - Source-only categorical geometry display.
      - Accept an externally explicit motion state only; do not classify swift automatically.
      - No polarity, magnitude, market label, score, price, or execution use.
    reviewer: CODEX_SOURCE_REVIEW_20260803
    founderDecision: APPROVED_FOR_SOURCE_ONLY_WITH_LIMITS
    founderReviewProposal: APPROVED_FOR_SOURCE_ONLY_WITH_LIMITS

  - evidencePacketId: TD1972_VEDHA_FIXED_THREE_DIRECTIONS_V15
    category: planet_specific_direction_rule
    sourceCitation:
      printedPage: '5'
      pdfImageIndex: 21
      locator: verse 15 and Hindi commentary
    originalSanskritHindiText:
      - 'राहुकेत् सदा वक्रौ शीघ्रगो चन्द्रभास्करो | गतेरेकस्वभावत्वादेषां दृष्टित्रयं सदा ॥ १५ ॥'
      - 'राहु तथा केतु सदाही वक्री और सूर्य तथा चन्द्र सदाही शीघ्रगामी होने से इन ४ ग्रहों का वेध सदा तीनों ही ओर को एकसा होता है।'
    literalTranscription:
      text: 'rahuketav sada vakrau sighrago candrabhaskaro; gater ekasvabhavat esam drstitrayam sada'
      status: OCR_ASSISTED_SOURCE_IMAGE_CITATION_CONTROLS_DISPUTED_READING
    literalTranslation: 'Rahu and Ketu are always retrograde; the Moon and Sun are swift. Because their motion nature is fixed, their three looks are always present.'
    implementationInterpretation: Emit all three figure-relative rays for these four bodies in the Trailokya profile.
    exactCategoricalRule:
      SUN: [LEFT, FRONT, RIGHT]
      MOON: [LEFT, FRONT, RIGHT]
      RAHU: [LEFT, FRONT, RIGHT]
      KETU: [LEFT, FRONT, RIGHT]
    numericalValue: null
    dependencies: [SBC_GRID_FIGURE_RELATIVE_ORIENTATION, TRAILOKYA_PROFILE_EXPLICIT_SELECTION]
    ambiguityNotes:
      - This is profile-specific and must not overwrite the Phaladeepika-editor profile.
      - It does not settle absolute board orientation.
    conflictingWitnessNotes: The existing Phaladeepika editor-supplement profile uses a different fixed-body treatment; no averaging is permitted.
    proposedVariableId: SBC_TD1972_FIXED_THREE_DIRECTION_BODIES
    permittedOscillatorRole: ACTIVATION
    proposedMode1Limitations:
      - Source-only categorical geometry display only.
      - Explicit Trailokya profile selection is required.
      - No score, magnitude, market direction, price, or execution use.
    reviewer: CODEX_SOURCE_REVIEW_20260803
    founderDecision: APPROVED_FOR_SOURCE_ONLY_WITH_LIMITS
    founderReviewProposal: APPROVED_FOR_SOURCE_ONLY_WITH_LIMITS

  - evidencePacketId: TD1972_VEDHA_RAY_EXTENT_V16_V17
    category: vedha_direction_or_ray_rule
    sourceCitation:
      printedPage: '5'
      pdfImageIndex: 21
      locator: verses 16-17 and Hindi commentary
    originalSanskritHindiText:
      - 'वामेतरा5ग्रदृष्टा च वेधास्त्रिधा प्रकोतिता: | क्रक्षाष्क्षरस्वरतिथिराशिवेधश्च पञ्चधा ॥ १६ ॥'
      - 'ग्रह: सव्यापसव्येन चक्षुषा वेधयेत्पुनः । ऋक्षाक्षरस्वरादिस्तु संधुखेनान्त्यभं तथा ॥ १७ ॥'
      - 'दाहिनी और बाई ओर के वेध से तो जो अक्षरादि वेध की सीध में आवेंगे उन सभी को वेध होता है, परन्तु सामने के वेध से केवल सामने के एक नक्षत्र को ही वेध होता है।'
    literalTranscription:
      text: 'vama-itara-agra-drsta ca vedhas tridha prakirtitah; grahah savyapasavyena caksusa vedhayet punah, rksaksarasvaradistu sammukhena antyabham tatha'
      status: OCR_ASSISTED_SOURCE_IMAGE_CITATION_CONTROLS_DISPUTED_READING
    literalTranslation: 'Vedha has left, right, and front forms across nakshatra, letter, vowel, tithi, and sign. Side looks strike aligned items; the front look reaches the opposite outer nakshatra.'
    implementationInterpretation: Side rays can enumerate aligned target cells; the front ray has one opposite-outer-nakshatra target and does not traverse intermediate cells.
    exactCategoricalRule:
      targetLayers: [NAKSHATRA, NAME_INITIAL, VOWEL, TITHI_GROUP, RASHI]
      LEFT: ALIGNED_LINE_ALL_RELEVANT_CELLS
      RIGHT: ALIGNED_LINE_ALL_RELEVANT_CELLS
      FRONT: OPPOSITE_OUTER_NAKSHATRA_ONLY
    numericalValue: null
    dependencies: [SBC_GRID_FIGURE_RELATIVE_ORIENTATION, SBC_GRID_TARGET_CELL_MAP]
    ambiguityNotes:
      - The source does not settle the workspace's absolute rotated orientation.
      - Corner, junction, Latta, and additional-line behavior is not admitted by this packet.
    conflictingWitnessNotes: Existing board fixtures are shared geometry tests only and are not relabeled as Trailokya worked examples.
    proposedVariableId: SBC_TD1972_RAY_EXTENT
    permittedOscillatorRole: ACTIVATION
    proposedMode1Limitations:
      - Source-only display of categorical target reach.
      - No numeric weighting, aggregation, price conversion, or execution use.
    reviewer: CODEX_SOURCE_REVIEW_20260803
    founderDecision: APPROVED_FOR_SOURCE_ONLY_WITH_LIMITS
    founderReviewProposal: APPROVED_FOR_SOURCE_ONLY_WITH_LIMITS

  - evidencePacketId: TD1972_NATURAL_PLANET_CLASS_PRACTICAL_INTRO
    category: natural_benefic_and_malefic_classification
    sourceCitation:
