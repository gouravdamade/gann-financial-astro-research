      pdfImageIndex: 11
      locator: practical Hindi instruction item 10
    originalSanskritHindiText:
      - 'चन्द्र, बुध, बृहस्पति और शुक्र ये ४ ग्रह शुभ और सूर्य, मंगल, शनि, राहु और केतु-ये ५ ग्रह अशुभ हैं परन्तु चन्द्रमा तो क्षीण हो जाने से और बुध अशुभ ग्रह के साथ होने से-यह दो शुभ ग्रह भी अशुभ हो जाते हैं।'
    literalTranscription:
      text: 'candra, budha, brhaspati aur sukra ye char graha subha; surya, mangala, sani, rahu aur ketu ye panca graha asubha; ksina candra aur asubha-graha-sanga budha bhi asubha hote hain'
      status: HINDI_SOURCE_TEXT_NORMALIZED_FOR_SEARCH_ONLY
    literalTranslation: 'Moon, Mercury, Jupiter, and Venus are benefic; Sun, Mars, Saturn, Rahu, and Ketu are malefic. A diminished Moon and Mercury associated with a malefic become malefic.'
    implementationInterpretation: Expose the unconditioned base classification as categorical source evidence; conditional Moon and Mercury states remain unknown gaps.
