  - evidencePacketId: TD1972_ISOLATED_RESULT_MODIFIERS_V166
    category: isolated_retrograde_exaltation_debilitation_modifier
    sourceCitation:
      printedPage: '39'
      pdfImageIndex: 55
      locator: verse 166 and Hindi commentary
    originalSanskritHindiText:
      - 'वक्रग्रहे फलं द्विघ्नं त्रिगुणं स्वोच्चसंस्थिते । स्वभावजं फलं शीघ्रे नीचस्थोऽधंफलो ग्रहः ॥ १६६ ॥'
      - 'स्थानफल देनेवाला ग्रह यदि वक्री हो तो पूर्वोक्त प्राप्त फल का दूना, शीघ्र गति में हो तो स्वभावानुकूल, उच्च राशि पर हो तो तिगुना, और नीच राशि पर हो तो आधा फल होता है।'
    literalTranscription:
      text: 'vakragrahe phalam dvighnam trigunam svoccasamsthite; svabhavajam phalam sighre nicstho ardham phalo grahah'
      status: OCR_ASSISTED_SOURCE_IMAGE_CITATION_CONTROLS_DISPUTED_READING
    literalTranslation: 'For a retrograde planet the result is double; for one situated in its exaltation it is triple; for a swift planet the natural result applies; for a debilitated planet it is half.'
    implementationInterpretation: Retain four isolated categorical modifier labels with their explicitly stated factors; do not combine them automatically.
    exactCategoricalRule:
      RETROGRADE: 2.0
      EXALTATION: 3.0
      DEBILITATION: 0.5
      SWIFT: 1.0
    numericalValue:
      unit: source_result_factor
      values: {RETROGRADE: 2.0, EXALTATION: 3.0, DEBILITATION: 0.5, SWIFT: 1.0}
    dependencies: [SOURCE_RESULT_BASE_DEFINITION, EXPLICIT_STATE_INPUT, STACKING_POLICY]
    ambiguityNotes:
      - The cited page does not supply a precedence or stacking method when multiple states coexist.
      - The factor modifies a source 'result'; it is not a validated oscillator magnitude or price multiplier.
      - The source gives no numeric swift-versus-mean motion threshold.
    conflictingWitnessNotes: Existing guidance profile factors are not promoted by this packet and must not be treated as a calibrated financial scale.
    proposedVariableId: SBC_TD1972_ISOLATED_RESULT_FACTORS
    permittedOscillatorRole: MAGNITUDE
