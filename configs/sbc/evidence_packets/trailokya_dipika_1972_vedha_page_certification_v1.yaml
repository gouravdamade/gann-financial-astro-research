      baseBenefic: [MOON, MERCURY, JUPITER, VENUS]
      baseMalefic: [SUN, MARS, SATURN, RAHU, KETU]
      conditionalUnknown: [MOON_DIMINISHED, MERCURY_ASSOCIATED_WITH_MALEFIC]
    numericalValue: null
    dependencies: [TRAILOKYA_PROFILE_EXPLICIT_SELECTION, CONDITION_POLICY_FOR_MOON_AND_MERCURY]
    ambiguityNotes:
