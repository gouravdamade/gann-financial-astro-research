[package]
name = "gann-astro-desk"
version = "0.10.56-pfr-v2b-r8-xe3r1"
description = "Private Gann and financial astrology research desktop"
authors = ["Gann Astro Research"]
edition = "2021"

[lib]
name = "gann_astro_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
futures-util = "0.3"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = "0.23"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
keyring-core = "=1.0.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
local-ip-address = "0.6"
rcgen = "0.14"
tower-http = { version = "0.6", features = ["limit", "trace"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
